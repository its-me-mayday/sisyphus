syntax = "proto3";

package acl;

option go_package = "github.com/tuousername/sisyphus/proto/acl";

// ─── Models ───────────────────────────────────────────────

enum Role {
  ROLE_UNSPECIFIED = 0;
  VIEWER           = 1;
  EDITOR           = 2;
  OWNER            = 3;
}

message User {
  string id         = 1;
  string username   = 2;
  string email      = 3;
  Role   role       = 4;
  int64  created_at = 5;
}

message Permission {
  string id         = 1;
  string user_id    = 2;
  string resource   = 3; // es. "list:uuid"
  Role   role       = 4;
  int64  created_at = 5;
}

// ─── Requests / Responses ─────────────────────────────────

message CreateUserRequest  { string username = 1; string email = 2; string password_hash = 3; }
message CreateUserResponse { User user       = 1; }

message GetUserRequest     { string id       = 1; }
message GetUserResponse    { User user       = 1; }

message DeleteUserRequest  { string id       = 1; }
message DeleteUserResponse { bool success    = 1; }

message GrantPermissionRequest {
  string user_id  = 1;
  string resource = 2;
  Role   role     = 3;
}
message GrantPermissionResponse { Permission permission = 1; }

message RevokePermissionRequest {
  string user_id  = 1;
  string resource = 2;
}
message RevokePermissionResponse { bool success = 1; }

message CheckPermissionRequest {
  string user_id  = 1;
  string resource = 2;
  Role   role     = 3;
}
message CheckPermissionResponse { bool allowed = 1; }

message ListPermissionsRequest  { string user_id  = 1; }
message ListPermissionsResponse { repeated Permission permissions = 1; }

// ─── Service ──────────────────────────────────────────────

service AclService {
  // Users
  rpc CreateUser (CreateUserRequest)  returns (CreateUserResponse);
  rpc GetUser    (GetUserRequest)     returns (GetUserResponse);
  rpc DeleteUser (DeleteUserRequest)  returns (DeleteUserResponse);

  // Permissions
  rpc GrantPermission  (GrantPermissionRequest)  returns (GrantPermissionResponse);
  rpc RevokePermission (RevokePermissionRequest) returns (RevokePermissionResponse);
  rpc CheckPermission  (CheckPermissionRequest)  returns (CheckPermissionResponse);
  rpc ListPermissions  (ListPermissionsRequest)  returns (ListPermissionsResponse);
}